name: Build OnePlus Ace2Pro SukiSU Ultra

on:
  workflow_dispatch:
    inputs:
      build_method:
        description: '构建方式 (gki=标准GKI, perf=性能优化)'
        type: choice
        required: true
        default: gki
        options: [gki, perf]
      enable_kpm:
        description: '启用 KPM (内核模块支持)'
        type: boolean
        required: true
        default: true
      enable_zram:
        description: '启用额外 ZRAM 算法 (LZ4KD)'
        type: boolean
        required: true
        default: false

env:
  # ---- 已核实的固定版本 ----
  OP_REPO: OnePlusOSS
  OP_MANIFEST_BRANCH: oneplus/sm8550
  OP_MANIFEST_FILE: oneplus_ace2_pro_b.xml
  OP_SOC: kalama
  ANDROID_VERSION: android13
  KERNEL_VERSION: '5.15'
  SUKISU_COMMIT: b16e899a555e9b96aa1225f049cd7274820ca5b8
  SUSFS_COMMIT: e30f1502a870434150efb16bd4a0d33277d7da57
  SUKISU_PATCH_COMMIT: eec45788c9a115e5498040298133336d6b6071dd
  AK3_REPO: https://github.com/Numbersf/AnyKernel3
  AK3_COMMIT: 47f23f7ece3ef212a392ec9ea5466e5f0b55d3c7

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048
          swap-size-mb: 8192
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'

      - name: Install dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git curl ca-certificates python3 python3-pip python-is-python3 \
            build-essential bc bison flex libssl-dev libelf-dev libxml2 libxml2-utils \
            rsync unzip zip lz4 pigz cpio kmod jq
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o /usr/local/bin/repo
          sudo chmod a+x /usr/local/bin/repo
          repo --version | head -n1

      - name: Show resolved versions
        run: |
          set -euo pipefail
          cat <<'EOF'
          Build target : OnePlus Ace 2 Pro (PJA110) / SM8550 kalama
          Manifest     : oneplus/sm8550 :: oneplus_ace2_pro_b.xml
          SukiSU Ultra : b16e899a555e9b96aa1225f049cd7274820ca5b8 (builtin)
          SUSFS        : gki-android13-5.15 @ e30f1502a870434150efb16bd4a0d33277d7da57
          SukiSU_patch : eec45788c9a115e5498040298133336d6b6071dd
          EOF

      - name: Init and sync official OnePlus sources
        run: |
          set -euo pipefail
          mkdir -p kernel_workspace
          cd kernel_workspace
          repo init -u https://github.com/${OP_REPO}/kernel_manifest.git \
            -b "refs/heads/${OP_MANIFEST_BRANCH}" -m "${OP_MANIFEST_FILE}" --depth=1
          repo sync -j"$(nproc --all)" --fail-fast --no-clone-bundle 2>&1 | tail -n 40
          echo "=== synced projects ==="
          du -sh kernel_platform/common kernel_platform/msm-kernel 2>/dev/null || true
          test -d kernel_platform/common/drivers
          test -d kernel_platform/msm-kernel

      - name: Drop ABI protected exports
        run: |
          set -euo pipefail
          cd kernel_workspace/kernel_platform
          if [ -f common/BUILD.bazel ]; then
            sed -i '/"protected_exports_list"[[:space:]]*:[[:space:]]*"android\/abi_gki_protected_exports_aarch64",/d' common/BUILD.bazel
          fi
          if [ -f msm-kernel/BUILD.bazel ]; then
            sed -i '/"protected_exports_list"[[:space:]]*:[[:space:]]*"android\/abi_gki_protected_exports_aarch64",/d' msm-kernel/BUILD.bazel
          fi
          rm -f common/android/abi_gki_protected_exports_* || true
          rm -f msm-kernel/android/abi_gki_protected_exports_* || true
          echo "protected exports removed"

      - name: Integrate SukiSU Ultra (builtin branch)
        run: |
          set -euo pipefail
          cd kernel_workspace/kernel_platform
          git clone --filter=blob:none https://github.com/SukiSU-Ultra/SukiSU-Ultra.git KernelSU
          git -C KernelSU checkout --detach "${SUKISU_COMMIT}"
          echo "SukiSU commit: $(git -C KernelSU rev-parse HEAD)"
          KSU_DIR="$(realpath "$PWD/KernelSU")"
          test -d "$KSU_DIR/kernel" || { echo "::error::KernelSU/kernel missing"; exit 1; }
          # builtin 分支的 kernel/ 里是 Makefile（不是 Kbuild）
          test -f "$KSU_DIR/kernel/Makefile" || { echo "::error::kernel/Makefile missing"; ls -la "$KSU_DIR/kernel"; exit 1; }
          DRIVER_DIR="$(realpath "$PWD/common/drivers")"
          echo "DRIVER_DIR=$DRIVER_DIR"
          test -d "$DRIVER_DIR" || { echo "::error::drivers dir missing"; exit 1; }
          # uapi 头文件在仓库根目录，内核按 "uapi/xxx.h" 引用
          if [ -d "$KSU_DIR/uapi" ] && [ ! -e "$KSU_DIR/kernel/uapi" ]; then
            ln -s ../uapi "$KSU_DIR/kernel/uapi"
            echo "linked uapi -> kernel/uapi"
          fi
          ln -sfn "$(realpath --relative-to="$DRIVER_DIR" "$KSU_DIR/kernel")" "$DRIVER_DIR/kernelsu"
          grep -q 'kernelsu' "$DRIVER_DIR/Makefile" || printf '\nobj-$(CONFIG_KSU) += kernelsu/\n' >> "$DRIVER_DIR/Makefile"
          grep -q 'drivers/kernelsu/Kconfig' "$DRIVER_DIR/Kconfig" || sed -i '/endmenu/i source "drivers/kernelsu/Kconfig"' "$DRIVER_DIR/Kconfig"
          echo "=== integration result ==="
          ls -l "$DRIVER_DIR/kernelsu/"
          tail -n 3 "$DRIVER_DIR/Makefile"
          grep -n 'kernelsu' "$DRIVER_DIR/Kconfig"

      - name: Fetch patch repositories
        run: |
          set -euo pipefail
          cd kernel_workspace
          git clone --filter=blob:none https://gitlab.com/simonpunk/susfs4ksu.git susfs4ksu
          git -C susfs4ksu checkout --detach "${SUSFS_COMMIT}"
          echo "SUSFS commit: $(git -C susfs4ksu rev-parse HEAD)"
          git clone --filter=blob:none https://github.com/SukiSU-Ultra/SukiSU_patch.git SukiSU_patch
          git -C SukiSU_patch checkout --detach "${SUKISU_PATCH_COMMIT}"
          echo "SukiSU_patch commit: $(git -C SukiSU_patch rev-parse HEAD)"
          ls susfs4ksu/kernel_patches/ | head -n 20

      - name: Apply SUSFS kernel patches
        run: |
          set -euo pipefail
          cd kernel_workspace
          PATCH="susfs4ksu/kernel_patches/50_add_susfs_in_gki-${ANDROID_VERSION}-${KERNEL_VERSION}.patch"
          test -f "$PATCH" || { echo "::error::missing SUSFS patch $PATCH"; ls susfs4ksu/kernel_patches/; exit 1; }
          cp "$PATCH" kernel_platform/common/
          cp -r susfs4ksu/kernel_patches/fs/* kernel_platform/common/fs/
          cp -r susfs4ksu/kernel_patches/include/linux/* kernel_platform/common/include/linux/
          cd kernel_platform/common
          echo "=== pre-check: namespace.c context ==="
          if grep -q 'trace/hooks/blk.h' fs/namespace.c; then
            echo "blk.h hook already present"
          else
            # SUSFS hunk #1 的上下文锚定 internal.h 之后的 #include <trace/hooks/blk.h>，
            # 一加 SM8550 源码缺少该行，导致 hunk 无法定位（fuzz 也救不了）。
            # 这里按上游 GKI 形态补上 include，使补丁上下文对齐。
            sed -i 's|^#include "internal.h"$|#include "internal.h"\n#include <trace/hooks/blk.h>|' fs/namespace.c
            grep -n 'trace/hooks/blk.h' fs/namespace.c
            echo "inserted trace/hooks/blk.h after internal.h"
          fi
          echo "=== applying SUSFS with fuzz ==="
          patch -p1 -F 3 --forward < "$(basename "$PATCH")" || true
          echo "=== check rejects ==="
          find fs -name '*.rej' -o -name '*.orig' 2>/dev/null | tee /tmp/susfs_rejects.txt
          if [ -s /tmp/susfs_rejects.txt ]; then
            echo "::warning::SUSFS produced reject files:"
            cat /tmp/susfs_rejects.txt
            echo "=== reject contents ==="
            find fs -name '*.rej' -exec cat {} \;
          fi
          # 硬失败：存在 reject 说明有功能块没进去，必须人工确认
          if find fs -name '*.rej' | grep -q .; then
            echo "::error::SUSFS patch left reject files, build cannot continue safely"
            exit 1
          fi
          echo "SUSFS patch applied without rejects"

      - name: Fix SUSFS task_mmu uninitialized dentry
        run: |
          set -euo pipefail
          cd kernel_workspace/kernel_platform/common
          FILE=fs/proc/task_mmu.c
          test -f "$FILE" || { echo "::error::$FILE missing"; exit 1; }
          # SUSFS 补丁在 show_map_vma 内留下未初始化的 `struct dentry *dentry;`；
          # 一加的 show_map_vma 不走该分支，Clang 报 -Wsometimes-uninitialized（-Werror 致命）。
          # 修法：把该声明就地初始化为 NULL。用固定字符串全局替换，避免行尾/缩进差异。
          echo "=== before ==="
          grep -n 'struct dentry \*dentry' "$FILE" || echo "(none)"
          grep -c 'struct dentry \*dentry;' "$FILE" || true
          perl -i -pe 's/\Qstruct dentry *dentry;\E/struct dentry *dentry = NULL;/g' "$FILE"
          # 若存在带空白的变体，再兜底处理一次
          perl -i -pe 's/\Qstruct dentry *dentry\E(\s*);\s*$/struct dentry *dentry = NULL;$1\n/ unless /=\s*NULL/' "$FILE"
          echo "=== after ==="
          grep -n 'struct dentry \*dentry' "$FILE" || echo "(none)"
          COUNT=$(grep -c 'struct dentry \*dentry' "$FILE" || true)
          COUNT=${COUNT:-0}
          INIT=$(grep -c 'struct dentry \*dentry = NULL;' "$FILE" || true)
          INIT=${INIT:-0}
          echo "declarations: $COUNT, initialized: $INIT"
          if [ "$COUNT" -eq 0 ]; then
            echo "::warning::no dentry declaration found; patch may already handle it"
          elif [ "$INIT" -eq 0 ]; then
            echo "::error::dentry declaration still uninitialized"
            exit 1
          fi

      - name: Apply builtin syscall hooks
        run: |
          set -euo pipefail
          cd kernel_workspace/kernel_platform/common
          HOOKS="$(realpath ../../SukiSU_patch/hooks)"
          # builtin 分支不注册 kprobes，必须给内核源码打 hook 入口，否则 root 不生效
          for p in syscall_hooks.patch scope_min_manual_hooks_v1.6.patch; do
            if [ -f "$HOOKS/$p" ]; then
              cp "$HOOKS/$p" .
              echo "=== applying $p ==="
              patch -p1 -F 3 --forward < "$p" || echo "::warning::$p partially applied"
            else
              echo "::warning::missing $HOOKS/$p"
            fi
          done
          echo "=== hook verification ==="
          grep -rn 'ksu_handle' fs/exec.c fs/open.c fs/stat.c 2>/dev/null | head -n 8 || echo "::warning::no ksu hooks found in fs/"

      - name: Apply hide_stuff patch
        run: |
          set -euo pipefail
          cd kernel_workspace
          test -f SukiSU_patch/69_hide_stuff.patch || { echo "::error::SukiSU_patch missing"; exit 1; }
          cp SukiSU_patch/69_hide_stuff.patch kernel_platform/common/
          cd kernel_platform/common
          echo "=== applying hide_stuff (fuzz allowed, failure tolerated) ==="
          patch -p1 -F 3 --forward < 69_hide_stuff.patch || echo "::warning::69_hide_stuff.patch did not apply fully"

      - name: Configure kernel
        run: |
          set -euo pipefail
          cd kernel_workspace/kernel_platform
          CONFIG_FILE=./common/arch/arm64/configs/gki_defconfig
          cat >> "$CONFIG_FILE" <<'EOF'
          CONFIG_KSU=y
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_TRY_UMOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          CONFIG_KSU_SUSFS_SUS_MAP=y
          CONFIG_KALLSYMS=y
          CONFIG_KALLSYMS_ALL=y
          EOF
          if [ "${{ inputs.enable_kpm }}" = "true" ]; then
            echo "CONFIG_KPM=y" >> "$CONFIG_FILE"
            echo "KPM enabled"
          fi
          sed -i 's/check_defconfig//' ./common/build.config.gki || true
          echo "=== config tail ==="
          tail -n 25 "$CONFIG_FILE"

      - name: Build kernel
        id: build
        run: |
          set -euo pipefail
          cd kernel_workspace
          mkdir -p build-logs
          # -Wno-sometimes-uninitialized：SUSFS 补丁在 OnePlus 版 show_map_vma 中
          # 留下未初始化的 dentry（该分支实际不会进入），Clang 在 -Werror 下判为错误。
          # 用 Clang 官方抑制开关放行，不改变补丁逻辑。
          export KCFLAGS="-Wno-sometimes-uninitialized -Wno-error=sometimes-uninitialized"
          LTO=thin SYSTEM_DLKM_RE_SIGN=0 BUILD_SYSTEM_DLKM=0 KMI_SYMBOL_LIST_STRICT_MODE=0 \
            ./kernel_platform/oplus/build/oplus_build_kernel.sh "${OP_SOC}" "${{ inputs.build_method }}" \
            2>&1 | tee build-logs/compile.log
          echo "build exit: ${PIPESTATUS[0]}"
          echo "=== locating Image ==="
          find kernel_platform -name 'Image' -type f -size +6M 2>/dev/null | head -n 20

      - name: Locate and stage Image
        run: |
          set -euo pipefail
          IMG=$(find kernel_workspace/kernel_platform -name 'Image' -type f -size +6M 2>/dev/null | head -n 1)
          test -n "$IMG" || { echo "::error::Image not found"; exit 1; }
          echo "Found Image: $IMG ($(stat -c%s "$IMG") bytes)"
          mkdir -p staging
          cp "$IMG" staging/Image
          sha256sum staging/Image | tee staging/Image.sha256

      - name: Prepare AnyKernel3
        run: |
          set -euo pipefail
          git clone --filter=blob:none "${AK3_REPO}" AnyKernel3
          git -C AnyKernel3 checkout --detach "${AK3_COMMIT}"
          rm -rf AnyKernel3/.git
          cp staging/Image AnyKernel3/Image
          grep -n 'block=\|do.devicecheck\|is_slot_device\|patch_vbmeta_flag' AnyKernel3/anykernel.sh || true

      - name: Collect logs and artifacts
        if: always()
        run: |
          set -euo pipefail
          mkdir -p out-logs
          cp -r kernel_workspace/build-logs/* out-logs/ 2>/dev/null || true
          if [ -d kernel_workspace/kernel_platform/common/out ]; then
            cp kernel_workspace/kernel_platform/common/out/.config out-logs/kernel.config 2>/dev/null || true
            cp kernel_workspace/kernel_platform/common/out/System.map out-logs/System.map 2>/dev/null || true
          fi
          find kernel_workspace -name '.config' -size +100k 2>/dev/null | head -n 3 | while read -r f; do cp "$f" out-logs/alt-config.txt; done || true
          ls -la out-logs || true

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Ace2Pro-SukiSU-Build-Logs
          path: out-logs/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload AnyKernel3
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Ace2Pro-SukiSU-AnyKernel3
          path: AnyKernel3/
          if-no-files-found: error
          retention-days: 30
